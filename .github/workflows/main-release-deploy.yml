name: Main Release and Portfolio Deploy

# One target, so no environment input. The portfolio is the public content
# property in the `kgwari-web` account — see kgwari-docs
# platform/web-content-account.md — not a product environment with dev and beta
# copies of itself.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_tag:
        description: Create a git version tag after a successful deploy
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: portfolio-release-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Portfolio
    runs-on: ubuntu-latest
    environment: production

    env:
      DEPLOY_ENVIRONMENT: production
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
      # OIDC only. A long-lived access key alongside OIDC is the weakest link
      # and the one nobody rotates — the static-key fallback this workflow used
      # to carry is gone with the account it belonged to.
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      # Overrides only. Both are read from stack outputs by default; set them
      # in the GitHub environment for a temporary pin, not as configuration.
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate AWS deploy configuration
        run: |
          set -euo pipefail

          if [ -z "${AWS_ROLE_TO_ASSUME:-}" ]; then
            echo "Missing secret AWS_ROLE_TO_ASSUME."
            echo "Set it on the 'production' GitHub environment to the role ARN"
            echo "printed by 'npm run account:build'."
            exit 1
          fi

          # The account is in cdk.json, not a GitHub variable — reviewable in a
          # pull request rather than edited invisibly.
          account_id="$(node -p "JSON.parse(require('fs').readFileSync('cdk.json','utf8')).context.productionAccountId")"
          if [ -z "$account_id" ]; then
            echo "cdk.json has no productionAccountId. Fill in the kgwari-web account id."
            exit 1
          fi
          echo "EXPECTED_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"

      - name: Configure AWS credentials (OIDC role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # The wrong-account guard, mirroring step 1 of bootstrap-account.mjs.
      # Cheap, and the failure it prevents is not.
      - name: Confirm the account
        run: |
          set -euo pipefail
          actual="$(aws sts get-caller-identity --query Account --output text)"
          if [ "$actual" != "$EXPECTED_ACCOUNT_ID" ]; then
            echo "Assumed a role in account $actual, but cdk.json names $EXPECTED_ACCOUNT_ID." >&2
            exit 1
          fi
          echo "Account $actual confirmed."

      - name: Deploy CDK stacks
        run: |
          set -euo pipefail
          npx cdk deploy "kgwari-web/*" \
            --require-approval never \
            --app "node dist/infra/cdk/bin/app.js"

      - name: Resolve portfolio deploy targets
        id: targets
        run: |
          set -euo pipefail

          STACK_NAME="kgwari-web-portfolio"
          BUCKET="${S3_BUCKET:-}"
          DISTRIBUTION_ID="${CLOUDFRONT_DISTRIBUTION_ID:-}"

          if [ -z "$BUCKET" ]; then
            BUCKET="$(aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='PortfolioBucketName'].OutputValue | [0]" \
              --output text)"
          fi

          if [ -z "$DISTRIBUTION_ID" ]; then
            DISTRIBUTION_ID="$(aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='PortfolioDistributionId'].OutputValue | [0]" \
              --output text)"
          fi

          if [ -z "$BUCKET" ] || [ "$BUCKET" = "None" ]; then
            echo "Could not resolve portfolio S3 bucket." >&2
            exit 1
          fi

          if [ -z "$DISTRIBUTION_ID" ] || [ "$DISTRIBUTION_ID" = "None" ]; then
            echo "Could not resolve portfolio CloudFront distribution id." >&2
            exit 1
          fi

          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$DISTRIBUTION_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy portfolio resources to S3
        run: |
          set -euo pipefail

          # Assets first. Their names are not content-hashed, so a diagram or a
          # stylesheet edit reuses its old name — `immutable` would strand the
          # previous copy in returning browsers for a year, where a CloudFront
          # invalidation cannot reach it. A day, then revalidate.
          aws s3 sync dist/site "s3://${{ steps.targets.outputs.bucket }}" \
            --delete \
            --cache-control "public,max-age=86400" \
            --exclude "*.html"

          # Every page revalidates, so edited prose is live on the next request.
          # Filtered `--delete` removes pages dropped from the site without
          # touching the assets the first pass just uploaded.
          aws s3 sync dist/site "s3://${{ steps.targets.outputs.bucket }}" \
            --delete \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html; charset=utf-8" \
            --exclude "*" \
            --include "*.html"

      - name: Invalidate CloudFront cache
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.targets.outputs.distribution_id }}" \
            --paths "/*"

      - name: Create version tag
        if: ${{ github.event_name == 'push' || github.event.inputs.create_tag == 'true' }}
        run: |
          set -euo pipefail

          VERSION_TAG="$(node scripts/portfolio-version.mjs tag)"
          git fetch --tags

          if git rev-parse "$VERSION_TAG" >/dev/null 2>&1; then
            echo "Tag $VERSION_TAG already exists. Skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION_TAG"
          git push origin "$VERSION_TAG"

AWSTemplateFormatVersion: "2010-09-09"

# The role CI assumes to deploy the portfolio. Least privilege — it does not
# carry AdministratorAccess, and it does not create its own OIDC provider.
#
# **How it deploys without permission to create anything.** `cdk deploy` does
# not build resources with these credentials: it assumes the bootstrap roles,
# and CloudFormation assumes `cfn-exec-role` to do the work. So this role needs
# `sts:AssumeRole` on the `cdk-*` roles, plus the few calls the workflow makes
# directly — read the stacks for the bucket and distribution, sync the built
# site, invalidate.
#
# **Prerequisites, both created by scripts/aws/bootstrap-account.mjs before this
# stack:** the OIDC provider and the CDK bootstrap. One provider exists per
# account, so this template imports it rather than creating a second one, which
# would fail with `EntityAlreadyExists`.
#
# Deploy into kgwari-web (see productionAccountId in cdk.json):
#
#   aws cloudformation deploy \
#     --region eu-west-1 \
#     --stack-name kgwari-github-actions-portfolio-role \
#     --template-file infra/aws/github-actions-role.yaml \
#     --capabilities CAPABILITY_NAMED_IAM

Description: GitHub Actions deploy role for the kgwari portfolio (least privilege)

Parameters:
  GitHubOwner:
    Type: String
    Default: EdwardSeshoka

  GitHubRepo:
    Type: String
    Default: kgwari-portfolio

  GitHubEnvironment:
    Type: String
    Default: production

  StackNamePrefix:
    Type: String
    Default: kgwari-web
    Description: >-
      Matches stackNamePrefix in environment-configuration.ts. It names the
      property, not the channel — the account is kgwari-web while the
      environment is production.

  RoleName:
    Type: String
    Default: github-actions-kgwari-portfolio-production

  BootstrapQualifier:
    Type: String
    Default: hnb659fds

Resources:
  PortfolioDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: Deploys the portfolio stacks and publishes the built site.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !ImportValue kgwari-github-oidc-provider-arn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # Four subjects: the workflow runs both against the `production`
                # environment and directly on `main` without one, and GitHub now
                # mints an **immutable subject** carrying numeric owner and
                # repository ids (`repo:owner@123/name@456:…`). An exact match on
                # the classic format stops matching the day either is adopted —
                # which is how this broke the first time CI ran after a rename.
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOwner}/${GitHubRepo}:environment:${GitHubEnvironment}
                  - !Sub repo:${GitHubOwner}@*/${GitHubRepo}@*:environment:${GitHubEnvironment}
                  - !Sub repo:${GitHubOwner}/${GitHubRepo}:ref:refs/heads/main
                  - !Sub repo:${GitHubOwner}@*/${GitHubRepo}@*:ref:refs/heads/main
      Policies:
        - PolicyName: deploy-portfolio
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AssumeCdkBootstrapRoles
                Effect: Allow
                Action: sts:AssumeRole
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-${BootstrapQualifier}-deploy-role-${AWS::AccountId}-eu-west-1
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-${BootstrapQualifier}-file-publishing-role-${AWS::AccountId}-eu-west-1
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-${BootstrapQualifier}-lookup-role-${AWS::AccountId}-eu-west-1
                  # us-east-1 holds the CloudFront certificate stack.
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-${BootstrapQualifier}-deploy-role-${AWS::AccountId}-us-east-1
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-${BootstrapQualifier}-file-publishing-role-${AWS::AccountId}-us-east-1
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-${BootstrapQualifier}-lookup-role-${AWS::AccountId}-us-east-1

              - Sid: ReadBootstrapVersion
                Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:eu-west-1:${AWS::AccountId}:parameter/cdk-bootstrap/${BootstrapQualifier}/version
                  - !Sub arn:${AWS::Partition}:ssm:us-east-1:${AWS::AccountId}:parameter/cdk-bootstrap/${BootstrapQualifier}/version

              # No Route 53 statement any more. The zone is created by the dns
              # stack rather than looked up at synth, so nothing needs to read it
              # with these credentials — `cdk deploy` writes records through the
              # bootstrap roles like every other resource.

              - Sid: ReadPortfolioStacks
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackNamePrefix}-portfolio/*
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackNamePrefix}-dns/*

              - Sid: PublishSite
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !Sub arn:${AWS::Partition}:s3:::${StackNamePrefix}-portfolio-websitebucket*

              - Sid: PublishSiteObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${StackNamePrefix}-portfolio-websitebucket*/*

              - Sid: InvalidateCache
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*
      Tags:
        - Key: Application
          Value: kgwari-portfolio
        - Key: ManagedBy
          Value: cloudformation

Outputs:
  RoleArn:
    Description: Set as AWS_ROLE_TO_ASSUME on the production GitHub environment
    Value: !GetAtt PortfolioDeployRole.Arn
